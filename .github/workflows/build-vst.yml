name: Build UpmixRT VST3 (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Install CMake and Ninja
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      # 2. Force the environment to use Visual Studio's MSVC compiler (x64)
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 3. Configure CMake (Now Ninja will safely use cl.exe instead of gcc)
      - name: Configure CMake
        run: cmake --preset default

      # 4. Build using the preset
      - name: Build plugin
        run: cmake --build --preset default --config Release

      # 5. Upload the resulting VST3 artifact
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpmixRT-VST3
          path: build/UpmixRT_artefacts/Release/VST3/*.vst3
