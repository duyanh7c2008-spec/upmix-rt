name: Build UpmixRT VST3 (Windows)

on:
  push:
  workflow_dispatch:

env:
  # Clears the Node.js 20 deprecation warning and forces the modern runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset default

      # Force CMake to build the proper Release configuration
      - name: Build plugin
        run: cmake --build build --config Release

      # Upload the resulting VST3 artifact using a recursive wildcard search
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpmixRT-VST3
          # Using ** ensures it grabs the .vst3 folder regardless of the Debug/Release path
          path: build/**/*.vst3/
          include-hidden-files: true
