name: Build UpmixRT VST3 (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Explicitly using windows-2025 to align with the upcoming runner update
    runs-on: windows-2025

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Uses a highly reliable, verified action to set up CMake and Ninja
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      # Use the default preset as dictated by your README
      - name: Configure CMake
        run: cmake --preset default

      # Build using the preset
      - name: Build plugin
        run: cmake --build --preset default --config Release

      # Upload the resulting VST3 artifact
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpmixRT-VST3
          path: build/UpmixRT_artefacts/Release/VST3/*.vst3
