name: Build UpmixRT VST3 (Windows)

on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 1. We force CMAKE_BUILD_TYPE to Release right here during configuration
      - name: Configure CMake
        run: cmake --preset default -DCMAKE_BUILD_TYPE=Release

      # 2. We explicitly tell the build command to compile the Release target
      - name: Build plugin
        run: cmake --build build --config Release

      # 3. This scans the build directory recursively to grab the final folder
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpmixRT-VST3
          path: build/**/*.vst3/
          include-hidden-files: true
